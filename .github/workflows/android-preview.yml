name: Android preview

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  termux-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build Termux and VPS binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o dist/termide-android-arm64 ./cmd/termide
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/termide-server-linux-amd64 ./cmd/termide-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/termide-server-linux-arm64 ./cmd/termide-server
          sha256sum dist/* > dist/SHA256SUMS
          tar -czf dist/termide-preview.tar.gz -C dist \
            termide-android-arm64 termide-server-linux-amd64 \
            termide-server-linux-arm64 SHA256SUMS
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termide-preview
          path: dist/termide-preview.tar.gz
      - name: Attach archive to tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/termide-preview.tar.gz --clobber
